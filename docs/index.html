<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AommA</title>
<style>
  :root {
    --bg: #f4f3ef; --text: #1c1c1a; --muted: #6b6a64; --line: #e3e2dc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1c19; --text: #ecece8; --muted: #a09f98; --line: #34352f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 56px 16px 80px; }
  h1 { font-size: 40px; line-height: 1.1; margin: 0 0 40px; letter-spacing: -0.02em; }
  h2 { font-size: 22px; margin: 0; }
  .room { margin: 0 0 56px; }
  .room header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 12px; }
  .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  figure { margin: 0; position: relative; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--line); }
  figure img, figure iframe { display: block; width: 100%; height: 100%; border: 0; object-fit: cover; }
  figcaption { position: absolute; left: 8px; bottom: 8px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
               background: rgba(0, 0, 0, 0.55); color: #fff; pointer-events: none; }
  .note { color: var(--muted); }
  @media (max-width: 640px) {
    main { padding-top: 32px; }
    h1 { font-size: 30px; }
    .pair { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>AommA</h1>
  <div id="rooms"><p class="note">Loading…</p></div>
</main>

<script type="module">
const rooms = document.getElementById("rooms");

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function room(entry) {
  const base = `showcase/${entry.slug}/`;
  return el("section", {className: "room"},
    el("header", {}, el("h2", {textContent: entry.title}), el("span", {className: "meta", textContent: entry.date})),
    el("div", {className: "pair"},
      el("figure", {},
        el("img", {src: base + "photo.jpg", alt: `Photo of the ${entry.title.toLowerCase()}`, loading: "lazy"}),
        el("figcaption", {textContent: "Photo"})),
      el("figure", {},
        el("iframe", {src: `viewer.html?scene=${encodeURIComponent(base + "scene.glb")}`, title: `${entry.title} in 3D`, loading: "lazy"}),
        el("figcaption", {textContent: "3D scene · drag to look around"}))));
}

try {
  const entries = await (await fetch("showcase/index.json")).json();
  rooms.replaceChildren(...entries.map(room));
} catch {
  rooms.replaceChildren(el("p", {className: "note", textContent: "Nothing here yet."}));
}
</script>
</body>
</html>
